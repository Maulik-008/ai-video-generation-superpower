<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; background: #000; overflow: hidden; }
      #root { position: relative; overflow: hidden; background: #000; }
      canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      #vig { position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse at 50% 46%, rgba(0,0,0,0) 52%, rgba(0,0,0,0.5) 100%); }
      #cap { position: absolute; left: 7%; right: 7%; text-align: center; white-space: pre-wrap;
        font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; font-weight: 600; line-height: 1.16;
        color: #fff; opacity: 0; letter-spacing: 0.1px;
        text-shadow: 0 2px 14px rgba(0,0,0,0.8), 0 0 3px rgba(0,0,0,0.55); }
      #ovl { position: absolute; left: 8%; right: 8%; top: 24%; transform: translateY(-50%); text-align: center;
        font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; font-weight: 700; line-height: 1.15;
        color: #fff; opacity: 0; text-shadow: 0 4px 24px rgba(0,0,0,0.85); }
      #fade { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="root">
      <canvas id="c"></canvas>
      <div id="vig"></div>
      <div id="cap"></div>
      <div id="ovl"></div>
      <div id="fade"></div>
    </div>
    <script src="player.js"></script>
  </body>
</html>
