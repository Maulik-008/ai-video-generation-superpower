<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; background: #000; overflow: hidden; }
      #root { position: relative; overflow: hidden; background: #000; }
      canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      #vig { position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse at 50% 46%, rgba(0,0,0,0) 52%, rgba(0,0,0,0.5) 100%); }
      #cap { position: absolute; left: 7%; right: 7%; text-align: center; white-space: pre-wrap;
        font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; font-weight: 600; line-height: 1.16;
        color: #fff; opacity: 0; letter-spacing: 0.1px; text-wrap: balance;
        text-shadow: 0 2px 14px rgba(0,0,0,0.8), 0 0 3px rgba(0,0,0,0.55); transform-origin: 50% 60%; }
      /* bold: short-form captions. Heavy type, a thick dark outline drawn under the fill, the spoken word highlighted */
      #cap.bold { font-family: 'Segoe UI Black', 'Arial Black', 'Nirmala UI', 'Segoe UI', 'Helvetica Neue', sans-serif; font-weight: 900;
        line-height: 1.1; letter-spacing: 0.005em; -webkit-text-stroke: 0.15em #0c0b14; paint-order: stroke fill;
        text-shadow: 0 0.07em 0 rgba(0,0,0,0.55), 0 0.12em 0.45em rgba(0,0,0,0.5); }
      #cap .w { display: inline-block; transform-origin: 50% 65%; margin: 0 0.07em; }
      #ovl { position: absolute; left: 8%; right: 8%; top: 24%; transform: translateY(-50%); text-align: center;
        font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; font-weight: 700; line-height: 1.15;
        color: #fff; opacity: 0; text-shadow: 0 4px 24px rgba(0,0,0,0.85);
        font-family: 'Segoe UI Black', 'Arial Black', 'Nirmala UI', 'Segoe UI', sans-serif; font-weight: 900;
        -webkit-text-stroke: 0.12em #0c0b14; paint-order: stroke fill; transform-origin: 50% 50%; }
      #fade { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="root">
      <canvas id="c"></canvas>
      <div id="vig"></div>
      <div id="cap"></div>
      <div id="ovl"></div>
      <div id="fade"></div>
    </div>
    <script src="player.js"></script>
  </body>
</html>
